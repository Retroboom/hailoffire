[build]
  publish = "hail-of-fire/hof-arsenal"
  functions = "netlify/functions"
  ignore = "git diff --quiet HEAD^ HEAD -- netlify/"

[build.environment]
  # Firebase client API keys are intentionally public (security is enforced by Firebase Rules)
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

[[plugins]]
  package = "@netlify/plugin-functions-install-core"
